[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.3",
    "openpyxl>=3.1.2",
    "reportlab>=4.2.0",
    "duckdb>=1.3.2",
    "boto3>=1.34.0",
    "b2sdk>=1.25.0",
    "celery[redis]>=5.3.1",
    "python-dotenv>=1.0.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
