services:
  - type: web
    name: health-screening-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: health-api
    buildCommand: pip install .
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: ZOHO_FROM_EMAIL
        sync: false
      - key: SMTP_SERVER
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MOTHERDUCK_TOKEN
        sync: false
      - key: BACKBLAZE_ACCESS_KEY_ID
        sync: false
      - key: BACKBLAZE_SECRET_ACCESS_KEY
        sync: false
      - key: BACKBLAZE_BUCKET_NAME
        value: HEALTH-SCREENING-REPORT
      - key: BACKBLAZE_ENDPOINT_URL
        value: https://s3.us-west-004.backblazeb2.com
      - key: TELE_ALERT_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        value: redis://localhost:6379/0
